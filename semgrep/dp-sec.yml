- id: dp-sec-018
  languages:
  - php
  severity: WARNING
  message: 'DP-SEC-018: a signature, token or hash is compared with ==/===/strcmp. Use hash_equals( $expected, $received )
    so the comparison time does not leak the value.'
  metadata:
    dp-sec-id: DP-SEC-018
    cwe: 'CWE-208: Observable Timing Discrepancy'
  patterns:
  - pattern-either:
    - pattern: '$S == $O'
    - pattern: '$O == $S'
    - pattern: '$S === $O'
    - pattern: '$O === $S'
    - pattern: '$S != $O'
    - pattern: '$O != $S'
    - pattern: '$S !== $O'
    - pattern: '$O !== $S'
    - pattern: 'strcmp($S, $O)'
    - pattern: 'strcmp($O, $S)'
    - pattern: 'strcasecmp($S, $O)'
    - pattern: 'strcasecmp($O, $S)'
  - metavariable-regex:
      metavariable: '$S'
      regex: '(?is)^(?![''\"])(?!.*(_count|_type|_algo|_len|_length|_name|_id|cache)\b)(?!.*cache).*(signature|hmac|\bsig\b|_sig\b|token|secret|digest|api_?key|hash|md5\(|sha1\()'
  - metavariable-regex:
      metavariable: '$O'
      regex: '(?is)^(?!(null|true|false|-?\d+|array\(\s*\)|\[\s*\]|[''\"].*|\\?[A-Z][A-Z0-9_]*|(self|static|parent)::\w+|\\?\w+::[A-Z][A-Z0-9_]*|\$\w*(_count|_len|_length|_type|_algo|_id|_name))$)'
  - pattern-not-inside: hash_equals(...)
